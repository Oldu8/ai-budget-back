# Hot reload: монтирует исходники, отключает кэш. Используется автоматически при docker compose up.
services:
  app:
    build:
      context: .
      target: development
    volumes:
      - ./.env:/app/.env
      - ./.env.testing:/app/.env.testing
      - ./app:/app/app
      - ./routes:/app/routes
      - ./config:/app/config
      - ./database:/app/database
      - ./resources/views:/app/resources/views
      - ./bootstrap/app.php:/app/bootstrap/app.php
      - ./storage:/app/storage
      - ./phpstan.neon:/app/phpstan.neon
      - ./phpunit.xml:/app/phpunit.xml
      - ./tests:/app/tests
      - ./composer.json:/app/composer.json
      - ./composer.lock:/app/composer.lock
    command: >
      sh -c "
        php artisan package:discover --ansi &&
        php artisan migrate --force --no-interaction &&
        php artisan serve --host=0.0.0.0 --port=$${PORT:-8080}
      "
